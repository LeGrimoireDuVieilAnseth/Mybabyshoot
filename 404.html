<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable | Mybabyshoot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Fraunces:ital,opsz,wght@1,9..144,400&family=Mulish:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--creme:#FAF4EA;--creme2:#EFE3D0;--encre:#322619;--doux:#80705C;--caramel:#B0824F;--cta:#5E4430;--ligne:#E6D8C3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--creme);color:var(--encre);font-family:'Mulish',-apple-system,'Segoe UI',sans-serif;
  line-height:1.65;padding:40px 22px}
.box{max-width:520px;text-align:center}
h1{font-family:'Bricolage Grotesque',sans-serif;font-size:30px;letter-spacing:-.02em;margin:0 0 14px}
.ser{font-family:'Fraunces',serif;font-style:italic;color:var(--caramel)}
p{color:var(--doux);margin:0 0 26px;font-size:15.5px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
a.btn{display:inline-block;text-decoration:none;padding:13px 26px;border-radius:999px;
  font-weight:600;font-size:15px}
a.plein{background:var(--cta);color:#fff}
a.vide{background:transparent;color:var(--encre);border:1px solid var(--ligne)}
.tel{margin-top:26px;font-size:14px;color:var(--doux)}
.tel a{color:var(--caramel)}
</style>
</head>
<body>
<div class="box">
  <h1>Cette page n'existe <span class="ser">plus</span></h1>
  <p>Le site a été refait récemment. Tout se trouve désormais sur une seule page :
  les formules, les disponibilités et la réservation.</p>
  <div class="btns">
    <a class="btn plein" href="/">Aller au site</a>
    <a class="btn vide" href="/#tarifs">Tarif et réservation</a>
  </div>
  <p class="tel">Une question ? <a href="tel:0647765417">06 47 76 54 17</a></p>
</div>
</body>
</html>
