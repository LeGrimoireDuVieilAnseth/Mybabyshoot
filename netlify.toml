# Le fichier _redirects n'etait pas pris en compte sur ce projet. Les regles
# declarees ici sont lues a la racine du depot, quel que soit le dossier
# publie, ce qui est plus fiable.

# Le site tient en une seule page. Les anciennes adresses du site Wix
# (indexees par Google, presentes dans de vieux liens) n'existent plus.
# Sans cette regle elles renvoient une erreur 404.
#
# Netlify sert d'abord les fichiers qui existent : index.html, legal.html,
# bon.html, les images, le CSS et le JS ne sont pas concernes. La regle ne
# s'applique qu'aux adresses introuvables.
#
# 301 = deplacement definitif. C'est ce qui dit a Google de reporter sur la
# page d'accueil ce qu'il attribuait a l'ancienne page.

[[redirects]]
  from = "/*"
  to = "/"
  status = 301
