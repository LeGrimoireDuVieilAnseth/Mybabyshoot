# Redirections des anciennes pages Wix.
#
# Le site Wix avait 96 adresses, retrouvees dans les archives du web. Google
# les a toujours en memoire et les affiche sous le resultat principal :
# "LE PHOTOGRAPHE", "Mariage", "BAIN DE LAIT", "Grossesse + Naissance,
# 5 tirages photos". Des prestations que Matt ne propose plus.
#
# Aujourd'hui ces adresses renvoient une erreur 404. Google finit par retirer
# une page en erreur, mais il attend d'etre sur, ce qui prend des semaines.
# Une redirection 301 est comprise immediatement et reporte sur la nouvelle
# page ce que Google attribuait a l'ancienne.
#
# Deux traitements differents selon les cas :
#   301 vers la bonne section pour tout ce qui existe encore
#   410 (definitivement supprime) pour ce que Matt ne fait plus. C'est le
#       signal le plus rapide pour disparaitre des resultats, et le plus
#       honnete : rediriger "mariage" vers un studio grossesse serait trompeur,
#       et Google traite ce genre de redirection comme une erreur deguisee.
#
# ATTENTION : ce fichier n'a AUCUN effet tant que le champ "Base directory"
# de Netlify n'est pas vide. C'est ce reglage qui empeche Netlify de le lire.

[build]
  publish = "."
  functions = "netlify/functions"

# ---------------------------------------------------------------
# Ce que Matt ne propose plus : on demande la suppression
# ---------------------------------------------------------------
[[redirects]]
  from = "/mariage"
  to = "/404.html"
  status = 410
  force = true

[[redirects]]
  from = "/bapteme"
  to = "/404.html"
  status = 410
  force = true

# ---------------------------------------------------------------
# Les pages de prestations et de produits Wix : vers les formules
# ---------------------------------------------------------------
[[redirects]]
  from = "/service-page/*"
  to = "/#tarifs"
  status = 301

[[redirects]]
  from = "/product-page/*"
  to = "/#tarifs"
  status = 301

[[redirects]]
  from = "/booking-calendar/*"
  to = "/#tarifs"
  status = 301

[[redirects]]
  from = "/category/*"
  to = "/#tarifs"
  status = 301

