# Redirections des anciennes pages Wix.
#
# Le site Wix avait 96 adresses, retrouvees dans les archives du web. Google
# les affiche toujours sous le resultat principal : "LE PHOTOGRAPHE",
# "Mariage", "BAIN DE LAIT", "Grossesse + Naissance, 5 tirages photos".
# Des prestations que Matt ne propose plus.
#
# Une redirection 301 est comprise tout de suite par Google et reporte sur la
# nouvelle page ce qu'il attribuait a l'ancienne. Une erreur 404 finit par
# marcher aussi, mais Google attend d'etre sur, ce qui prend des semaines.
#
# PAS DE REGLE ATTRAPE-TOUT.
# Le fichier en contenait une, "/*" vers "/", et elle n'a jamais fonctionne :
# ce motif attrape aussi "/" lui-meme, la regle se mord la queue et Netlify
# l'ecarte. C'est ce qui a fait croire que le reglage "Base directory"
# bloquait le fichier, alors que le champ etait vide et que le reste marchait.
#
# On s'en passe tres bien : les 96 anciennes adresses sont connues et toutes
# couvertes ci-dessous, nommement ou par motif. Ce qui n'y figure pas tombe
# sur la page 404 du site, qui propose de vraies portes de sortie. C'est
# aussi ce que Google prefere : rediriger n'importe quelle adresse inconnue
# vers l'accueil est traite comme une erreur deguisee.

[build]
  publish = "."
  functions = "netlify/functions"

# ---------------------------------------------------------------
# Prestations et produits Wix : une soixantaine d'adresses
# ---------------------------------------------------------------
[[redirects]]
  from = "/service-page/*"
  to = "/#tarifs"
  status = 301

[[redirects]]
  from = "/product-page/*"
  to = "/#tarifs"
  status = 301

[[redirects]]
  from = "/booking-calendar/*"
  to = "/#tarifs"
  status = 301

[[redirects]]
  from = "/category/*"
  to = "/#tarifs"
  status = 301

