  status = 410
  force = true

[[redirects]]
  from = "/store-categories-sitemap.xml"
  to = "/404.html"
  status = 410
  force = true

# ---------------------------------------------------------------
# Tout le reste des anciennes adresses : vers l'accueil.
# En dernier, car Netlify applique la premiere regle qui correspond.
# Les fichiers qui existent (index.html, legal.html, images, robots.txt,
# sitemap.xml) sont servis avant d'arriver ici.
# ---------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/"
  status = 301
