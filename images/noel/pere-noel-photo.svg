<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 124">
  <!-- Le Pere Noel photographe : deux rennes posent, il se dandine un peu,
       et le flash part toutes les quatre secondes. Le nez du premier renne
       luit. Aucune animation si le telephone demande moins de mouvement. -->
  <defs>
    <radialGradient id="eclair" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".35" stop-color="#FFF8D6" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFF3B0" stop-opacity="0"/>
    </radialGradient>
    <g id="renne">
      <rect x="35" y="86" width="5" height="24" rx="2" fill="#6B4220"/>
      <rect x="45" y="88" width="5" height="22" rx="2" fill="#5A3418"/>
      <rect x="62" y="88" width="5" height="22" rx="2" fill="#5A3418"/>
      <rect x="71" y="86" width="5" height="24" rx="2" fill="#6B4220"/>
      <rect x="34" y="107" width="7" height="4" rx="1.5" fill="#2B1A10"/>
      <rect x="70" y="107" width="7" height="4" rx="1.5" fill="#2B1A10"/>
      <ellipse cx="55" cy="80" rx="27" ry="14" fill="#8B5A2B"/>
      <ellipse cx="55" cy="85" rx="17" ry="7" fill="#A8774A"/>
      <path d="M29 75 q-7 -2 -6 4" fill="none" stroke="#8B5A2B" stroke-width="4" stroke-linecap="round"/>
      <path d="M72 76 Q78 64 80 56" fill="none" stroke="#8B5A2B" stroke-width="11" stroke-linecap="round"/>
      <path d="M76 48 L72 36 L65 33 M72 36 L74 28 M85 48 L89 36 L96 33 M89 36 L87 28" fill="none" stroke="#D9B98A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="74" cy="50" rx="4" ry="2.4" fill="#7A4A26" transform="rotate(-30 74 50)"/>
      <ellipse cx="81" cy="56" rx="11" ry="9" fill="#8B5A2B"/>
      <ellipse cx="90" cy="60" rx="7" ry="5.5" fill="#A8774A"/>
      <circle cx="82" cy="53" r="1.7" fill="#2B1A10"/>
      <path d="M74 66 Q80 70 86 66" fill="none" stroke="#B5122B" stroke-width="3" stroke-linecap="round"/>
      <circle cx="80" cy="69" r="2.2" fill="#F2C14E"/>
    </g>
  </defs>
  <style>
    .pere{transform-box:fill-box;transform-origin:50% 100%;animation:dandine 2.4s ease-in-out infinite}
    .flash{transform-box:fill-box;transform-origin:center;animation:flash 4s ease-out infinite;opacity:0}
    .rayons{transform-box:fill-box;transform-origin:center;animation:flash 4s ease-out infinite;opacity:0}
    .nez{animation:luit 1.4s ease-in-out infinite alternate}
    .tete2{transform-box:fill-box;transform-origin:30% 90%;animation:penche 4s ease-in-out infinite}
    @keyframes dandine{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-2px) rotate(-1.5deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-2px) rotate(1.5deg)}}
    @keyframes flash{0%,86%{opacity:0;transform:scale(.4)}88%{opacity:1;transform:scale(1.15)}94%{opacity:.35;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
    @keyframes luit{from{fill:#E23B4F}to{fill:#FF6B7E}}
    @keyframes penche{0%,70%,100%{transform:rotate(0)}80%,90%{transform:rotate(-6deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.flash,.rayons{opacity:0}}
  </style>
  <!-- les deux rennes, celui du fond un peu plus petit -->
  <g transform="translate(-6 6) scale(.9)" opacity=".92"><use href="#renne"/></g>
  <g transform="translate(34 0)">
    <use href="#renne"/>
    <circle class="nez" cx="96.5" cy="59" r="3.6" fill="#E23B4F"/>
  </g>
  <!-- le Pere Noel, tourne vers les rennes, l'appareil devant le visage -->
  <g class="pere">
    <rect x="205" y="98" width="9" height="14" fill="#B5122B"/>
    <rect x="218" y="98" width="9" height="14" fill="#B5122B"/>
    <path d="M202 110 h14 v6 h-16 a3 3 0 0 1 2 -6 Z M216 110 h14 a3 3 0 0 1 0 6 h-14 Z" fill="#2B1A10"/>
    <path d="M198 100 Q196 70 216 64 Q236 70 234 100 Z" fill="#C8102E"/>
    <rect x="198" y="96" width="36" height="6" rx="3" fill="#FFFDF8"/>
    <rect x="198" y="84" width="36" height="5" fill="#2B1A10"/>
    <rect x="212" y="83" width="8" height="7" rx="1" fill="none" stroke="#F2C14E" stroke-width="2"/>
    <path d="M216 64 V96" stroke="#FFFDF8" stroke-width="3"/>
    <circle cx="216" cy="52" r="11" fill="#F2C9A5"/>
    <path d="M205 54 Q205 74 216 76 Q227 74 227 54 Q222 60 216 59 Q210 60 205 54 Z" fill="#FFFDF8"/>
    <path d="M210 60 Q216 63 222 60" fill="none" stroke="#E6DCCB" stroke-width="2" stroke-linecap="round"/>
    <path d="M204 46 Q206 30 222 30 Q234 31 238 42 Q231 38 226 41 Q229 44 228 46 Z" fill="#C8102E"/>
    <rect x="202" y="43" width="28" height="6" rx="3" fill="#FFFDF8"/>
    <circle cx="239" cy="43" r="4" fill="#FFFDF8"/>
    <path d="M200 74 Q190 68 194 58" fill="none" stroke="#C8102E" stroke-width="7" stroke-linecap="round"/>
    <path d="M230 74 Q222 64 204 58" fill="none" stroke="#B5122B" stroke-width="7" stroke-linecap="round"/>
    <circle cx="196" cy="58" r="3.5" fill="#2B1A10"/>
    <rect x="186" y="47" width="22" height="15" rx="3" fill="#2B2B2B"/>
    <rect x="191" y="43" width="8" height="5" rx="1.5" fill="#3A3A3A"/>
    <circle cx="188" cy="54.5" r="5.5" fill="#4A4A4A" stroke="#9A9A9A" stroke-width="1.5"/>
    <circle cx="187" cy="53.5" r="1.6" fill="#BFD8FF"/>
    <rect x="200" y="49" width="5" height="3" rx="1" fill="#F2C14E"/>
  </g>
  <!-- le flash -->
  <circle class="flash" cx="186" cy="50" r="24" fill="url(#eclair)"/>
  <g class="rayons" stroke="#FFF3B0" stroke-width="2.5" stroke-linecap="round">
    <path d="M186 22 V30 M186 70 V78 M158 50 H166 M206 50 H212 M166 30 L171 35 M201 65 L206 70 M166 70 L171 65 M201 35 L206 30"/>
  </g>
</svg>
